version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: fintraq-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: expense-tracker

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintraq-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/expense-tracker
      JWT_SECRET: change_this_secret_in_production_abc123xyz
      PORT: 5000
      NODE_ENV: development
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintraq-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo_data:
